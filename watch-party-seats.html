        name="viewport"
        content="width=device-width, initial-scale=1.0"

    <title>
        Watch Party Seats — TEDxRegents Secondary School Bali YOUTH
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #191919;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        .progress {
            display: flex;
            justify-content: space-between;
            margin-bottom: 50px;
            font-size: 12px;
            color: #999;
        }

        .progress div {
            flex: 1;
            text-align: center;
        }

        .progress .active {
            color: #191919;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 32px;

        .subtitle {
            color: #666;
            margin-bottom: 35px;
        }

        .attendee-section {
            margin-bottom: 40px;

        .attendee-title {
            font-size: 14px;

            margin-bottom: 15px;

        .seat-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
            max-width: 650px;
        }

        .seat {
            aspect-ratio: 1;
            border: 1px solid #ccc;
            background: #fff;
            color: #191919;
            cursor: pointer;
            border-radius: 5px;

            transition: 0.15s ease;
        }

        .seat:hover:not(:disabled) {
            background: #f2f2f2;
        }

        .seat.selected {
            background: #191919;
            color: #fff;
            border-color: #191919;
        }

        .seat.unavailable {
            background: #eee;
            color: #aaa;
            cursor: not-allowed;
            border-color: #ddd;
        }

        .actions {
            margin-top: 40px;
        }

        .continue-button,
        .back-button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .continue-button {
            background: #191919;
            color: #fff;
        }

        .continue-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .back-button {
            background: #eee;

        }

            margin-top: 20px;

    </style>
</head>

<body>

<div class="container">

    <div class="progress">
        <div>01 Tickets</div>
        <div>02 Details</div>
        <div>03 Attendees</div>
        <div class="active">04 Seats</div>
        <div>05 Add-ons</div>
        <div>06 Review</div>
        <div>07 Payment</div>
    </div>

    <h1>Watch Party Seats</h1>

    <div class="subtitle">
        Choose a seat for each Watch Party attendee.
    </div>

    <div id="seatSections"></div>

    <div
        id="message"
        class="message"
    ></div>

    <div class="actions">
        <button
            type="button"
            class="back-button"
            onclick="window.location.href='seats.html'"
        >
            Back
        </button>

        <button
            type="button"
            class="continue-button"
            id="continueButton"
            disabled
        >
            Continue
        </button>
    </div>

</div>

<script>
    const ticketQuantities =
        JSON.parse(
            localStorage.getItem("ticketQuantities")
        ) || {
            mainHall: 0,
            vip: 0,
            watchParty: 0
        };

    const attendees =
        JSON.parse(
            localStorage.getItem("attendees")
        ) || [];

    let selectedSeats =
        JSON.parse(
            localStorage.getItem("selectedSeats")
        ) || {};

    const mainHallAndVipCount =
        ticketQuantities.mainHall +
        ticketQuantities.vip;

    const totalTickets =
        ticketQuantities.mainHall +
        ticketQuantities.vip +
        ticketQuantities.watchParty;

    const mainHallAndVipAttendees = [];

    let attendeeNumber = 1;

    for (
        let i = 0;
        i < ticketQuantities.mainHall;
        i++
    ) {
        mainHallAndVipAttendees.push({
            number: attendeeNumber,
            name:
                attendees[
                    attendeeNumber - 1
                ]?.name || "",
            type: "Main Hall",
            venue: "mainHall"
        });

        attendeeNumber++;
    }

    for (
        let i = 0;
        i < ticketQuantities.vip;
        i++
    ) {
        mainHallAndVipAttendees.push({
            number: attendeeNumber,
            name:
                attendees[
                    attendeeNumber - 1
                ]?.name || "",
            type: "VIP",
            venue: "mainHall"
        });

        attendeeNumber++;
    }

    const watchPartyAttendees = [];

    for (
        let i = 0;
        i < ticketQuantities.watchParty;
        i++
    ) {
        watchPartyAttendees.push({
            number: attendeeNumber,
            name:
                attendees[
                    attendeeNumber - 1
                ]?.name || "",
            type: "Watch Party",
            venue: "watchParty"
        });

        attendeeNumber++;
    }

    /*
     * Remove selections belonging to tickets
     * that are no longer part of the current order.
     */
    const validAttendeeNumbers =
        new Set(
            Array.from(
                {
                    length: totalTickets
                },
                (_, index) =>
                    String(index + 1)
            )
        );

    Object.keys(selectedSeats).forEach(
        number => {
            if (
                !validAttendeeNumbers.has(
                    String(number)
                )
            ) {
                delete selectedSeats[number];
            }
        }
    );

    localStorage.setItem(
        "selectedSeats",
        JSON.stringify(selectedSeats)
    );

    const seatSections =
        document.getElementById(
            "seatSections"
        );

    const continueButton =
        document.getElementById(
            "continueButton"
        );

    const message =
        document.getElementById(
            "message"
        );

    async function loadSeats() {
        try {
            const response =
                await fetch(
                    "/api/seats?zone=Watch%20Party"
                );

            const data =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    "Could not load Watch Party seats."
                );
            }

            const pretixSeats =
                data.results || [];

            renderSeatSections(
                pretixSeats
            );

            updateContinueButton();

        } catch (error) {
            console.error(error);

            message.textContent =
                error.message ||
                "Could not load Watch Party seats.";
        }
    }

    function renderSeatSections(
        pretixSeats
    ) {
        seatSections.innerHTML = "";

        if (
            watchPartyAttendees.length === 0
        ) {
            seatSections.innerHTML =
                "<p>No Watch Party seats are required.</p>";

            continueButton.disabled =
                false;

            return;
        }

        watchPartyAttendees.forEach(
            attendee => {
                const section =
                    document.createElement(
                        "div"
                    );

                section.className =
                    "attendee-section";

                const title =
                    document.createElement(
                        "div"
                    );

                title.className =
                    "attendee-title";

                title.textContent =
                    "ATTENDEE " +
                    attendee.number +
                    " - Watch Party" +
                    (
                        attendee.name
                            ? " — " +
                              attendee.name
                            : ""
                    );

                section.appendChild(
                    title
                );

                const grid =
                    document.createElement(
                        "div"
                    );

                grid.className =
                    "seat-grid";

                for (
                    let row = 0;
                    row < 10;
                    row++
                ) {
                    for (
                        let seat = 1;
                        seat <= 10;
                        seat++
                    ) {
                        const button =
                            document.createElement(
                                "button"
                            );

                        button.type =
                            "button";

                        button.className =
                            "seat";

                        const rowLetter =
                            String.fromCharCode(
                                65 + row
                            );

                        const temporaryId =
                            "watchParty-" +
                            rowLetter +
                            "-" +
                            seat;

                        button.dataset.seatId =
                            temporaryId;

                        button.textContent =
                            seat;

                        const pretixSeat =
                            pretixSeats.find(
                                item => {
                                    const sameNumber =
                                        String(
                                            item.seat_number
                                        ) ===
                                        String(
                                            seat
                                        );

                                    const sameRow =
                                        String(
                                            item.row_name
                                        ) ===
                                        String(
                                            row + 1
                                        ) ||
                                        String(
                                            item.row_name
                                        ).toUpperCase() ===
                                        rowLetter;

                                    return (
                                        sameNumber &&
                                        sameRow
                                    );
                                }
                            );

                        if (
                            pretixSeat &&
                            (
                                pretixSeat.blocked ||
                                pretixSeat.orderposition ||
                                pretixSeat.cartposition ||
                                pretixSeat.voucher
                            )
                        ) {
                            button.classList.add(
                                "unavailable"
                            );

                            button.disabled =
                                true;
                        }

                        if (
                            selectedSeats[
                                attendee.number
                            ]?.id ===
                            temporaryId
                        ) {
                            button.classList.add(
                                "selected"
                            );
                        }

                        button.addEventListener(
                            "click",
                            function () {
                                selectSeat(
                                    attendee,
                                    temporaryId,
                                    rowLetter,
                                    seat
                                );
                            }
                        );

                        grid.appendChild(
                            button
                        );
                    }
                }

                section.appendChild(
                    grid
                );

                seatSections.appendChild(
                    section
                );
            }
        );
    }

    function selectSeat(
        attendee,
        seatId,
        rowLetter,
        seatNumber
    ) {
        /*
         * Prevent the same seat from being
         * selected by two attendees.
         */
        Object.keys(selectedSeats).forEach(
            number => {
                if (
                    String(number) !==
                    String(
                        attendee.number
                    ) &&
                    selectedSeats[number]?.id ===
                    seatId
                ) {
                    delete selectedSeats[number];
                }
            }
        );

        selectedSeats[
            attendee.number
        ] = {
            id: seatId,
            display:
                "Row " +
                rowLetter +
                ", Seat " +
                seatNumber
        };

        localStorage.setItem(
            "selectedSeats",
            JSON.stringify(
                selectedSeats
            )
        );

        loadSeats();
    }

    function allCurrentSeatsSelected() {
        const allCurrentAttendees = [
            ...mainHallAndVipAttendees,
            ...watchPartyAttendees
        ];

        return allCurrentAttendees.every(
            attendee =>
                selectedSeats[
                    attendee.number
                ]?.id
        );
    }

    function updateContinueButton() {
        continueButton.disabled =
            !allCurrentSeatsSelected();
    }

    continueButton.addEventListener(
        "click",
        function () {
            if (
                !allCurrentSeatsSelected()
            ) {
                message.textContent =
                    "Please select a seat for every attendee.";

                return;
            }

            createPretixCart();
        }
    );

    async function createPretixCart() {
        message.textContent =
            "Reserving your seats...";

        continueButton.disabled =
            true;

        /*
         * Always build the seat list from the
         * current attendee list rather than
         * Object.keys(selectedSeats).
         *
         * This guarantees the seat order matches
         * the ticket order from checkout.
         */
        const allCurrentAttendees = [
            ...mainHallAndVipAttendees,
            ...watchPartyAttendees
        ];

        const seats =
            allCurrentAttendees.map(
                attendee =>
                    selectedSeats[
                        attendee.number
                    ]?.id
            );

        if (
            seats.length !==
            totalTickets ||
            seats.some(
                seat => !seat
            )
        ) {
            message.textContent =
                "Please select a seat for every attendee.";

            continueButton.disabled =
                false;

            return;
        }

        try {
            const checkout =
                JSON.parse(
                    sessionStorage.getItem(
                        "checkout"
                    )
                );

            if (
                !checkout ||
                !checkout.checkoutId
            ) {
                throw new Error(
                    "Your checkout could not be found. Please start again."
                );
            }

            if (
                !Array.isArray(
                    checkout.tickets
                ) ||
                checkout.tickets.length !==
                totalTickets
            ) {
                throw new Error(
                    "Your ticket reservation does not match the current tickets. Please start again."
                );
            }

            const response =
                await fetch(
                    "/api/create-cart",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body:
                            JSON.stringify({
                                checkoutId:
                                    checkout.checkoutId,
                                seats:
                                    seats
                            })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error ||
                    "Could not reserve your seats."
                );
            }

            sessionStorage.setItem(
                "pretixCart",
                JSON.stringify(
                    data
                )
            );

            window.location.href =
                "addons.html";

        } catch (error) {
            console.error(error);

            message.textContent =
                error.message ||
                "Could not reserve your seats.";

            continueButton.disabled =
                false;
        }
    }

    loadSeats();
</script>

</body>
</html>
