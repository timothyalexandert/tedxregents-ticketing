<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seats — TEDxRegents Secondary School Bali YOUTH</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .seat-section {
            margin-bottom: 40px;
        }

        .seat-section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .seat-section-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        .seat-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
            max-width: 720px;
            margin: 0 auto;
        }

        .seat {
            aspect-ratio: 1;
            border: 1px solid #d8d8d8;
            border-radius: 7px;
            background: #fff;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: 0.15s ease;
        }

        .seat:hover:not(.unavailable):not(.selected) {
            border-color: #191919;
        }

        .seat.selected {
            background: #191919;
            color: #fff;
            border-color: #191919;
        }

        .seat.unavailable {
            background: #e8e8e8;
            color: #999;
            border-color: #e8e8e8;
            cursor: not-allowed;
        }

        .seat-legend {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 22px;
            font-size: 13px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .legend-box {
            width: 15px;
            height: 15px;
            border-radius: 4px;
            border: 1px solid #d8d8d8;
            background: #fff;
        }

        .legend-box.selected {
            background: #191919;
            border-color: #191919;
        }

        .legend-box.unavailable {
            background: #e8e8e8;
            border-color: #e8e8e8;
        }

        .seat-error {
            color: #d00000;
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            display: none;
        }

        .ticketing-back-button {
            position: absolute;
            left: 24px;
            top: 24px;
            background: none;
            border: none;
            font-size: 32px;
            line-height: 1;
            cursor: pointer;
            color: #191919;
        }

        .ticketing-back-button:hover {
            opacity: 0.65;
        }

        @media (max-width: 700px) {
            .seat-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 8px;
            }

            .seat-legend {
                flex-wrap: wrap;
                gap: 14px;
            }
        }
    </style>
</head>

<body>

    <button
        type="button"
        class="ticketing-back-button"
        onclick="goBackFromSeats()"
    >
        ‹
    </button>

    <main class="ticketing-page">

        <div class="progress-container">
            <div class="progress-step completed">
                <span>01</span>
                <p>Tickets</p>
            </div>

            <div class="progress-step completed">
                <span>02</span>
                <p>Details</p>
            </div>

            <div class="progress-step completed">
                <span>03</span>
                <p>Attendees</p>
            </div>

            <div class="progress-step active">
                <span>04</span>
                <p>Seats</p>
            </div>

            <div class="progress-step">
                <span>05</span>
                <p>Add-ons</p>
            </div>

            <div class="progress-step">
                <span>06</span>
                <p>Review</p>
            </div>

            <div class="progress-step">
                <span>07</span>
                <p>Payment</p>
            </div>
        </div>

        <section class="ticketing-card">

            <div class="ticketing-header">
                <h1>Select Your Seats</h1>
                <p>
                    Choose a seat for each Main Hall or VIP attendee.
                </p>
            </div>

            <div id="seatContainer"></div>

            <div class="seat-error" id="seatError"></div>

            <div class="seat-legend">
                <div class="legend-item">
                    <div class="legend-box"></div>
                    <span>Available</span>
                </div>

                <div class="legend-item">
                    <div class="legend-box selected"></div>
                    <span>Selected</span>
                </div>

                <div class="legend-item">
                    <div class="legend-box unavailable"></div>
                    <span>Unavailable</span>
                </div>
            </div>

            <button
                type="button"
                class="continue-button"
                onclick="continueFromSeats()"
            >
                Continue
            </button>

        </section>

    </main>

    <script>

        const MAIN_HALL_SEATS = [
            "A1","A2","A3","A4","A5","A6","A7","A8","A9","A10",
            "B1","B2","B3","B4","B5","B6","B7","B8","B9","B10",
            "C1","C2","C3","C4","C5","C6","C7","C8","C9","C10",
            "D1","D2","D3","D4","D5","D6","D7","D8","D9","D10",
            "E1","E2","E3","E4","E5","E6","E7","E8","E9","E10",
            "F1","F2","F3","F4","F5","F6","F7","F8","F9","F10",
            "G1","G2","G3","G4","G5","G6","G7","G8","G9","G10",
            "H1","H2","H3","H4","H5","H6","H7","H8","H9","H10",
            "I1","I2","I3","I4","I5","I6","I7","I8","I9","I10",
            "J1","J2","J3","J4","J5","J6","J7","J8","J9","J10"
        ];

        const checkoutData =
            JSON.parse(
                sessionStorage.getItem("checkout")
            ) || {};

        const ticketQuantities =
            JSON.parse(
                localStorage.getItem("ticketQuantities")
            ) || {};

        const mainHallQuantity =
            Number(
                ticketQuantities.mainHall || 0
            );

        const vipQuantity =
            Number(
                ticketQuantities.vip || 0
            );

        const watchPartyQuantity =
            Number(
                ticketQuantities.watchParty || 0
            );

        const requiredMainHallSeats =
            mainHallQuantity + vipQuantity;

        let selectedSeats =
            JSON.parse(
                localStorage.getItem("selectedSeats")
            ) || [];

        let unavailableSeats = [];

        function showLoadingOverlay(title, message) {

            const overlay =
                document.createElement("div");

            overlay.id =
                "order-overlay";

            overlay.style.position =
                "fixed";

            overlay.style.inset =
                "0";

            overlay.style.background =
                "rgba(20, 33, 61, 0.48)";

            overlay.style.backdropFilter =
                "blur(14px)";

            overlay.style.webkitBackdropFilter =
                "blur(14px)";

            overlay.style.zIndex =
                "2147483647";

            overlay.style.display =
                "flex";

            overlay.style.alignItems =
                "center";

            overlay.style.justifyContent =
                "center";

            const modal =
                document.createElement("div");

            modal.style.width =
                "min(420px, calc(100vw - 48px))";

            modal.style.maxWidth =
                "420px";

            modal.style.padding =
                "40px 30px";

            modal.style.background =
                "#ffffff";

            modal.style.borderRadius =
                "20px";

            modal.style.textAlign =
                "center";

            modal.style.boxShadow =
                "0 20px 60px rgba(0,0,0,0.25)";

            const spinner =
                document.createElement("div");

            spinner.className =
                "order-spinner";

            const heading =
                document.createElement("h2");

            heading.textContent =
                title;

            const paragraph =
                document.createElement("p");

            paragraph.textContent =
                message;

            modal.appendChild(spinner);
            modal.appendChild(heading);
            modal.appendChild(paragraph);

            overlay.appendChild(modal);

            document.body.appendChild(overlay);

            return overlay;
        }

        async function loadUnavailableSeats() {

            try {

                const response =
                    await fetch(
                        "/api/get-seats"
                    );

                if (!response.ok) {
                    return;
                }

                const data =
                    await response.json();

                unavailableSeats =
                    Array.isArray(data.seats)
                        ? data.seats
                        : [];

            } catch (error) {

                console.error(
                    "Could not load unavailable seats:",
                    error
                );

            }

        }

        function renderSeats() {

            const container =
                document.getElementById(
                    "seatContainer"
                );

            container.innerHTML = "";

            const section =
                document.createElement("div");

            section.className =
                "seat-section";

            const title =
                document.createElement("div");

            title.className =
                "seat-section-title";

            title.textContent =
                "Main Hall & VIP";

            const subtitle =
                document.createElement("div");

            subtitle.className =
                "seat-section-subtitle";

            subtitle.textContent =
                `Please select ${requiredMainHallSeats} seat${requiredMainHallSeats === 1 ? "" : "s"}.`;

            const grid =
                document.createElement("div");

            grid.className =
                "seat-grid";

            MAIN_HALL_SEATS.forEach(
                seatNumber => {

                    const button =
                        document.createElement("button");

                    button.type =
                        "button";

                    button.className =
                        "seat";

                    button.textContent =
                        seatNumber;

                    const unavailable =
                        unavailableSeats.includes(
                            seatNumber
                        );

                    const selected =
                        selectedSeats.includes(
                            seatNumber
                        );

                    if (unavailable) {

                        button.classList.add(
                            "unavailable"
                        );

                        button.disabled =
                            true;

                    } else if (selected) {

                        button.classList.add(
                            "selected"
                        );

                    }

                    button.addEventListener(
                        "click",
                        () => toggleSeat(seatNumber)
                    );

                    grid.appendChild(button);

                }
            );

            section.appendChild(title);
            section.appendChild(subtitle);
            section.appendChild(grid);

            container.appendChild(section);

        }

        function toggleSeat(seatNumber) {

            if (
                unavailableSeats.includes(
                    seatNumber
                )
            ) {
                return;
            }

            const index =
                selectedSeats.indexOf(
                    seatNumber
                );

            if (index !== -1) {

                selectedSeats.splice(
                    index,
                    1
                );

            } else {

                if (
                    selectedSeats.length >=
                    requiredMainHallSeats
                ) {
                    return;
                }

                selectedSeats.push(
                    seatNumber
                );

            }

            localStorage.setItem(
                "selectedSeats",
                JSON.stringify(
                    selectedSeats
                )
            );

            renderSeats();

        }

        async function createPretixCart() {

            const response =
                await fetch(
                    "/api/create-cart",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            checkoutId:
                                checkoutData.checkoutId,

                            selectedSeats:
                                selectedSeats

                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Could not reserve your seats."
                );

            }

            sessionStorage.setItem(
                "pretixCart",
                JSON.stringify(data)
            );

        }

        async function continueFromSeats() {

            const errorElement =
                document.getElementById(
                    "seatError"
                );

            errorElement.style.display =
                "none";

            if (
                requiredMainHallSeats === 0
            ) {

                selectedSeats = [];

                localStorage.removeItem(
                    "selectedSeats"
                );

                if (
                    watchPartyQuantity > 0
                ) {

                    window.location.href =
                        "watch-party-seats.html";

                } else {

                    window.location.href =
                        "addons.html";

                }

                return;
            }

            if (
                selectedSeats.length !==
                requiredMainHallSeats
            ) {

                errorElement.textContent =
                    `Please select exactly ${requiredMainHallSeats} seat${requiredMainHallSeats === 1 ? "" : "s"}.`;

                errorElement.style.display =
                    "block";

                return;
            }

            const button =
                document.querySelector(
                    ".continue-button"
                );

            button.disabled =
                true;

            const loadingOverlay =
                showLoadingOverlay(
                    "Securing your seats...",
                    "Please wait while we reserve your seats."
                );

            try {

                if (
                    watchPartyQuantity > 0
                ) {

                    sessionStorage.setItem(
                        "seatsCompleted",
                        "true"
                    );

                    window.location.href =
                        "watch-party-seats.html";

                    return;
                }

                await createPretixCart();

                sessionStorage.setItem(
                    "seatsCompleted",
                    "true"
                );

                window.location.href =
                    "addons.html";

            } catch (error) {

                console.error(
                    "Create cart error:",
                    error
                );

                if (loadingOverlay) {
                    loadingOverlay.remove();
                }

                alert(
                    error.message ||
                    "Could not reserve your seats. Please try again."
                );

                button.disabled =
                    false;
            }

        }

        async function goBackFromSeats() {

            const checkoutData =
                JSON.parse(
                    sessionStorage.getItem(
                        "checkout"
                    )
                );

            const checkoutId =
                checkoutData &&
                (
                    checkoutData.checkoutId ||
                    checkoutData.checkout_id
                );

            if (checkoutId) {

                try {

                    const response =
                        await fetch(
                            "/api/release-cart",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    checkoutId:
                                        checkoutId
                                })
                            }
                        );

                    const data =
                        await response.json();

                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        console.error(
                            "Could not release seat reservation:",
                            data
                        );

                        alert(
                            "We couldn't release your seat reservation. Please try again."
                        );

                        return;
                    }

                } catch (error) {

                    console.error(
                        "Release cart error:",
                        error
                    );

                    alert(
                        "We couldn't release your seat reservation. Please check your connection and try again."
                    );

                    return;
                }
            }

            localStorage.removeItem(
                "selectedSeats"
            );

            sessionStorage.removeItem(
                "pretixCart"
            );

            sessionStorage.removeItem(
                "seatsCompleted"
            );

            window.location.href =
                "attendees.html";
        }

        async function initializeSeats() {

            if (
                requiredMainHallSeats === 0
            ) {

                renderSeats();

                return;
            }

            await loadUnavailableSeats();

            renderSeats();

        }

        initializeSeats();

    </script>

</body>
</html>
