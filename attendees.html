</main>

<script src="progress.js"></script>

<script>

const savedTicketQuantities =
    localStorage.getItem("ticketQuantities");

const ticketQuantities =
    savedTicketQuantities
        ? JSON.parse(savedTicketQuantities)
        : {
            mainHall: 0,
            vip: 0,
            watchParty: 0
        };

const ordererDetails =
    JSON.parse(localStorage.getItem("ordererDetails")) || {
        name: "",
        email: "",
        phone: ""
    };

const attendeeFields =
    document.getElementById("attendeeFields");

let attendeeNumber = 0;

const mainHallQuantity =
    Number(ticketQuantities.mainHall || 0);

const vipQuantity =
    Number(ticketQuantities.vip || 0);

const watchPartyQuantity =
    Number(ticketQuantities.watchParty || 0);

const totalAttendees =
    mainHallQuantity +
    vipQuantity +
    watchPartyQuantity;

console.log(
    "Ticket quantities:",
    ticketQuantities
);

console.log(
    "Total attendees:",
    totalAttendees
);


/* =========================
   ADD ATTENDEE FIELDS
========================= */

function addAttendeeFields(ticketType, quantity) {

    for (let i = 1; i <= quantity; i++) {

        attendeeNumber++;

        const box =
            totalAttendees > 2
                ? document.createElement("details")
                : document.createElement("div");

        box.className =
            "attendee-box";

        if (totalAttendees > 2) {

            if (attendeeNumber === 1) {
                box.open = true;
            }

            box.innerHTML = 
                <summary class="attendee-heading">

                    <span class="attendee-name">
                        ATTENDEE ${attendeeNumber}
                        <em> - ${ticketType}</em>
                    </span>

                    <span class="attendee-arrow">⌄</span>

                </summary>

                <div class="attendee-content">

                    <div class="form-group">

                        <label
                            for="attendeeName${attendeeNumber}"
                        >
                            Full name
                        </label>

                        <input
                            type="text"
                            id="attendeeName${attendeeNumber}"
                            placeholder="Enter full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <div class="email-label-row">

                            <label
                                for="attendeePhone${attendeeNumber}"
                            >
                                Phone number
                            </label>

                            <label class="same-orderer">

                                <input
                                    type="checkbox"
                                    id="sameAsOrdererPhone${attendeeNumber}"
                                    onchange="toggleOrdererPhone(${attendeeNumber})"
                                >

                                <span>Same as orderer</span>

                            </label>

                        </div>

                        <input
                            type="tel"
                            id="attendeePhone${attendeeNumber}"
                            placeholder="+62 812 3456 7890"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <div class="email-label-row">

                            <label
                                for="attendeeEmail${attendeeNumber}"
                            >
                                Email address
                            </label>

                            <label class="same-orderer">

                                <input
                                    type="checkbox"
                                    id="sameAsOrdererEmail${attendeeNumber}"
                                    onchange="toggleOrdererEmail(${attendeeNumber})"
                                >

                                <span>Same as orderer</span>

                            </label>

                        </div>

                        <input
                            type="email"
                            id="attendeeEmail${attendeeNumber}"
                            placeholder="you@example.com"
                            required
                        >

                    </div>

                </div>
            `;

        } else {

            box.innerHTML = `
                <div class="attendee-heading">

                    <span class="attendee-name">
                        ATTENDEE ${attendeeNumber}
                        <em> - ${ticketType}</em>
                    </span>

                </div>

                <div class="attendee-content">

                    <div class="form-group">

                        <label
                            for="attendeeName${attendeeNumber}"
                        >
                            Full name
                        </label>

                        <input
                            type="text"
                            id="attendeeName${attendeeNumber}"
                            placeholder="Enter full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <div class="email-label-row">

                            <label
                                for="attendeePhone${attendeeNumber}"
                            >
                                Phone number
                            </label>

                            <label class="same-orderer">

                                <input
                                    type="checkbox"
                                    id="sameAsOrdererPhone${attendeeNumber}"
                                    onchange="toggleOrdererPhone(${attendeeNumber})"
                                >

                                <span>Same as orderer</span>

                            </label>

                        </div>

                        <input
                            type="tel"
                            id="attendeePhone${attendeeNumber}"
                            placeholder="+62 812 3456 7890"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <div class="email-label-row">

                            <label
                                for="attendeeEmail${attendeeNumber}"
                            >
                                Email address
                            </label>

                            <label class="same-orderer">

                                <input
                                    type="checkbox"
                                    id="sameAsOrdererEmail${attendeeNumber}"
                                    onchange="toggleOrdererEmail(${attendeeNumber})"
                                >

                                <span>Same as orderer</span>

                            </label>

                        </div>

                        <input
                            type="email"
                            id="attendeeEmail${attendeeNumber}"
                            placeholder="you@example.com"
                            required
                        >

                    </div>

                </div>
            ;
        }

        attendeeFields.appendChild(box);
    }
}


/* =========================
   SAME AS ORDERER — PHONE
========================= */

function toggleOrdererPhone(number) {

    const checkbox =
        document.getElementById(
            `sameAsOrdererPhone${number}`
        );

    const phoneInput =
        document.getElementById(
            `attendeePhone${number}`
        );

    if (checkbox.checked) {

        phoneInput.value =
            ordererDetails.phone;

        phoneInput.disabled =
            true;

    } else {

        phoneInput.value =
            "";

        phoneInput.disabled =
            false;
    }
}


/* =========================
   SAME AS ORDERER — EMAIL
========================= */

function toggleOrdererEmail(number) {

    const checkbox =
        document.getElementById(
            `sameAsOrdererEmail${number}`
        );

    const emailInput =
        document.getElementById(
            `attendeeEmail${number}`
        );

    if (checkbox.checked) {

        emailInput.value =
            ordererDetails.email;

        emailInput.disabled =
            true;

    } else {

        emailInput.value =
            "";

        emailInput.disabled =
            false;
    }
}


/* =========================
SAVE ATTENDEES
========================= */

document
.getElementById("attendeesForm")
.addEventListener("submit", function(event) {


    event.preventDefault();

    const attendees = [];


    for (let i = 1; i <= attendeeNumber; i++) {

        attendees.push({

            name:
                document
                    .getElementById(
                        `attendeeName${i}`
                    )
                    .value
                    .trim(),

            phone:
                document
                    .getElementById(
                        `attendeePhone${i}`
                    )
                    .value
                    .trim(),

            email:
                document
                    .getElementById(
                        `attendeeEmail${i}`
                    )
                    .value
                    .trim()

        });

    }


    localStorage.setItem(
        "attendees",
        JSON.stringify(attendees)
    );
    
    sessionStorage.setItem(
        "attendeesCompleted",
        "true"
    );


    if (Number(ticketQuantities.mainHall || 0) > 0) {

        window.location.href =
            "seats.html";

    } else {

        window.location.href =
            "watch-party-seats.html";

    }

});


</script>

</body>

</html>
