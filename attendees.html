<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendees — TEDxRegents Secondary School Bali YOUTH</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">
        TEDxRegents Secondary School Bali <strong>YOUTH</strong>
    </div>
</header>


<main>

    <div class="progress">
        <span>01 Tickets</span>
        <span>02 Details</span>
        <span class="active">03 Attendees</span>
        <span>04 Seats</span>
        <span>05 Add-ons</span>
        <span>06 Review</span>
        <span>07 Payment</span>
    </div>


    <section class="details-section">

        <p class="eyebrow">ATTENDEES</p>

        <h1>Who’s attending?</h1>

        <p class="subtitle">
            Enter the details of each person attending the event.
        </p>


        <form id="attendeesForm">

            <div id="attendeeFields"></div>


            <button
                type="submit"
                class="continue-button"
            >
                Continue
            </button>

        </form>

    </section>

</main>


<script>

const ticketQuantities =
    JSON.parse(localStorage.getItem("ticketQuantities")) || {
        mainHall: 0,
        vip: 0,
        watchParty: 0
    };


const ordererDetails =
    JSON.parse(localStorage.getItem("ordererDetails")) || {
        name: "",
        email: "",
        phone: ""
    };


const attendeeFields =
    document.getElementById("attendeeFields");


let attendeeNumber = 0;


const totalAttendees =
    ticketQuantities.mainHall +
    ticketQuantities.vip +
    ticketQuantities.watchParty;


function addAttendeeFields(ticketType, quantity) {

    for (let i = 1; i <= quantity; i++) {

        attendeeNumber++;


        /*
            Use normal boxes for 1–2 attendees.

            If there are more than 2 attendees,
            use native collapsible <details>.
        */

        if (totalAttendees > 2) {

            const box = document.createElement("details");

            box.className = "attendee-box";

            if (attendeeNumber === 1) {
                box.open = true;
            }


            box.innerHTML = `

                <summary class="attendee-heading">

                    <span class="attendee-name">
                        ATTENDEE ${attendeeNumber}
                        <em>— ${ticketType}</em>
                    </span>

                    <span class="attendee-arrow">⌄</span>

                </summary>


                <div class="attendee-content">

                    <div class="form-group">

                        <label for="attendeeName${attendeeNumber}">
                            Full name
                        </label>

                        <input
                            type="text"
                            id="attendeeName${attendeeNumber}"
                            placeholder="Enter full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <div class="email-label-row">

                            <label for="attendeeEmail${attendeeNumber}">
                                Email address
                            </label>

                            <label class="same-orderer">

                                <input
                                    type="checkbox"
                                    id="sameAsOrderer${attendeeNumber}"
                                    onchange="toggleOrdererEmail(${attendeeNumber})"
                                >

                                <span>Same as orderer</span>

                            </label>

                        </div>


                        <input
                            type="email"
                            id="attendeeEmail${attendeeNumber}"
                            placeholder="you@example.com"
                            required
                        >

                    </div>

                </div>

            `;

            attendeeFields.appendChild(box);

        } else {

            const box = document.createElement("div");

            box.className = "attendee-box";


            box.innerHTML = `

                <div class="attendee-heading">

                    <span class="attendee-name">
                        ATTENDEE ${attendeeNumber}
                        <em>— ${ticketType}</em>
                    </span>

                </div>


                <div class="attendee-content">

                    <div class="form-group">

                        <label for="attendeeName${attendeeNumber}">
                            Full name
                        </label>

                        <input
                            type="text"
                            id="attendeeName${attendeeNumber}"
                            placeholder="Enter full name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <div class="email-label-row">

                            <label for="attendeeEmail${attendeeNumber}">
                                Email address
                            </label>

                            <label class="same-orderer">

                                <input
                                    type="checkbox"
                                    id="sameAsOrderer${attendeeNumber}"
                                    onchange="toggleOrdererEmail(${attendeeNumber})"
                                >

                                <span>Same as orderer</span>

                            </label>

                        </div>


                        <input
                            type="email"
                            id="attendeeEmail${attendeeNumber}"
                            placeholder="you@example.com"
                            required
                        >

                    </div>

                </div>

            `;

            attendeeFields.appendChild(box);
        }
    }
}


function toggleOrdererEmail(number) {

    const checkbox =
        document.getElementById(`sameAsOrderer${number}`);

    const emailInput =
        document.getElementById(`attendeeEmail${number}`);


    if (checkbox.checked) {

        emailInput.value = ordererDetails.email;

        emailInput.disabled = true;

    } else {

        emailInput.value = "";

        emailInput.disabled = false;

    }
}


addAttendeeFields(
    "Main Hall",
    ticketQuantities.mainHall
);

addAttendeeFields(
    "VIP",
    ticketQuantities.vip
);

addAttendeeFields(
    "Watch Party",
    ticketQuantities.watchParty
);


document
    .getElementById("attendeesForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const attendees = [];


        for (let i = 1; i <= attendeeNumber; i++) {

            attendees.push({

                name:
                    document
                        .getElementById(`attendeeName${i}`)
                        .value
                        .trim(),

                email:
                    document
                        .getElementById(`attendeeEmail${i}`)
                        .value
                        .trim()

            });

        }


        localStorage.setItem(
            "attendees",
            JSON.stringify(attendees)
        );


        window.location.href = "seats.html";

    });

</script>

</body>

</html>
```
