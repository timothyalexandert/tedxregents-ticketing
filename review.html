<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Review — TEDxRegents Secondary School Bali YOUTH</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
    <img
        src="logo-white.png"
        alt="TEDxRegents Secondary School Bali YOUTH"
        class="site-logo"
    >
</header>


<main>

    <!-- PROGRESS -->

    <div class="progress">
        <span>01 Tickets</span>
        <span>02 Details</span>
        <span>03 Attendees</span>
        <span>04 Seats</span>
        <span>05 Add-ons</span>
        <span class="active">06 Review</span>
        <span>07 Payment</span>
    </div>


    <!-- INTRO -->

    <section class="review-section">

        <p class="eyebrow">REVIEW</p>

        <h1>Check your order.</h1>

        <p class="subtitle">
            Make sure everything looks right before continuing to payment.
        </p>


        <!-- ATTENDEES -->

        <div class="review-section-heading">
            <h2>Attendees</h2>
        </div>

        <div id="reviewAttendees"></div>


        <!-- ADD-ONS -->

        <div class="review-section-heading addons-review-heading">
            <h2>Add-ons</h2>
        </div>

        <div class="review-block">

            <div id="reviewAddons"></div>

        </div>


        <!-- PRICE BREAKDOWN -->

        <div class="review-section-heading price-heading">
            <h2>Price Breakdown</h2>
        </div>

        <div class="price-breakdown">

            <div id="ticketPriceBreakdown"></div>

            <div id="addonPriceBreakdown"></div>

            <div class="price-divider"></div>

            <div class="price-line subtotal-line">
                <span>Subtotal</span>
                <strong id="subtotalPrice">Rp0</strong>
            </div>

        </div>


        <!-- TOTAL -->

        <div class="review-total">

            <span>Total</span>

            <strong id="reviewTotal">
                Rp0
            </strong>

        </div>


        <!-- CONTINUE -->

        <button
            type="button"
            class="continue-button"
            id="continueToPayment"
        >
            Continue to Payment
        </button>

    </section>

</main>


<script>

    /* =========================================================
       PRICES
       ========================================================= */

    const earlyBirdPrices = {
        "Main Hall": 40000,
        "VIP": 50000,
        "Watch Party": 25000
    };

    const normalPrices = {
        "Main Hall": 45000,
        "VIP": 55000,
        "Watch Party": 30000
    };

    const addonPrices = {
        "Tote Bag": 60000,
        "Notebook": 30000,
        "Pen": 10000,
        "Lanyard": 15000,
        "Sticker Pack": 3000,
        "Food": 30000
    };


    /* =========================================================
       HELPERS
       ========================================================= */

    function formatRupiah(amount) {
        return "Rp" + Number(amount || 0).toLocaleString("id-ID");
    }


    function getStoredJSON(key, fallback) {

        try {

            const value = localStorage.getItem(key);

            if (!value) {
                return fallback;
            }

            return JSON.parse(value);

        } catch (error) {

            console.error(
                "Could not read localStorage:",
                key,
                error
            );

            return fallback;
        }
    }


    function getAttendeeName(attendee) {

        return (
            attendee.fullName ||
            attendee.name ||
            attendee.attendeeName ||
            ""
        );
    }


    function getAttendeeEmail(attendee) {

        return (
            attendee.email ||
            attendee.attendeeEmail ||
            ""
        );
    }


    function getTicketType(attendee) {

        return (
            attendee.ticketType ||
            attendee.ticket ||
            attendee.type ||
            ""
        );
    }


    /* =========================================================
       LOAD DATA
       ========================================================= */

    const quantities =
        getStoredJSON("ticketQuantities", {});

    const attendees =
        getStoredJSON("attendees", []);

    const selectedSeats =
        getStoredJSON("selectedSeats", {});

    const selectedWatchPartySeats =
        getStoredJSON("selectedWatchPartySeats", {});

    const addons =
        getStoredJSON("addons", {});

    const addonOwner =
        localStorage.getItem("addonOwner") || "";


    /* =========================================================
       NORMALISE TICKET QUANTITIES
       ========================================================= */

    const ticketQuantities = {
        "Main Hall":
            Number(
                quantities["Main Hall"] ||
                quantities["mainHall"] ||
                0
            ),

        "VIP":
            Number(
                quantities["VIP"] ||
                quantities["vip"] ||
                0
            ),

        "Watch Party":
            Number(
                quantities["Watch Party"] ||
                quantities["watchParty"] ||
                0
            )
    };


    /* =========================================================
       DETERMINE PRICES
       ========================================================= */

    let mainAndVipCount = 0;
    let watchPartyCount = 0;

    let ticketTotal = 0;

    const attendeeTicketPrices = [];


    /*
     * Main Hall + VIP share the same Early Bird pool.
     */

    attendees.forEach((attendee, index) => {

        const ticketType = getTicketType(attendee);

        let price = 0;

        if (
            ticketType === "Main Hall" ||
            ticketType === "VIP"
        ) {

            if (mainAndVipCount < 10) {

                price =
                    earlyBirdPrices[ticketType];

            } else {

                price =
                    normalPrices[ticketType];
            }

            mainAndVipCount++;

        } else if (ticketType === "Watch Party") {

            if (watchPartyCount < 10) {

                price =
                    earlyBirdPrices[ticketType];

            } else {

                price =
                    normalPrices[ticketType];
            }

            watchPartyCount++;
        }

        ticketTotal += price;

        attendeeTicketPrices[index] = price;
    });


    /*
     * Fallback:
     *
     * If attendee data is missing for some reason,
     * calculate from ticket quantities instead.
     */

    if (attendees.length === 0) {

        let combinedPosition = 0;

        ["Main Hall", "VIP"].forEach(ticketType => {

            const quantity =
                ticketQuantities[ticketType];

            for (let i = 0; i < quantity; i++) {

                const price =
                    combinedPosition < 10
                        ? earlyBirdPrices[ticketType]
                        : normalPrices[ticketType];

                ticketTotal += price;

                combinedPosition++;
            }
        });


        for (
            let i = 0;
            i < ticketQuantities["Watch Party"];
            i++
        ) {

            const price =
                i < 10
                    ? earlyBirdPrices["Watch Party"]
                    : normalPrices["Watch Party"];

            ticketTotal += price;
        }
    }


    /* =========================================================
       ATTENDEE BOXES
       ========================================================= */

    const reviewAttendees =
        document.getElementById("reviewAttendees");


    if (attendees.length === 0) {

        reviewAttendees.innerHTML = `
            <div class="review-block">
                <p class="review-empty">
                    No attendee information found.
                </p>
            </div>
        `;

    } else {

        attendees.forEach((attendee, index) => {

            const name =
                getAttendeeName(attendee) ||
                "Name not provided";

            const email =
                getAttendeeEmail(attendee) ||
                "Email not provided";

            const ticketType =
                getTicketType(attendee) ||
                "Ticket type not provided";

            let seat = null;

            if (ticketType === "Watch Party") {

                seat =
                    selectedWatchPartySeats[index];

            } else {

                seat =
                    selectedSeats[index];
            }


            const seatDisplay =
                seat?.display ||
                seat?.name ||
                seat?.label ||
                "No seat selected";


            const price =
                attendeeTicketPrices[index] || 0;


            const box =
                document.createElement("div");

            box.className =
                "attendee-review-card";


            box.innerHTML = `

                <div class="attendee-review-header">

                    <div>

                        <span class="attendee-review-number">
                            ATTENDEE ${index + 1}
                        </span>

                        <h3>
                            ${name}
                        </h3>

                    </div>

                    <strong class="attendee-review-price">
                        ${formatRupiah(price)}
                    </strong>

                </div>


                <div class="attendee-review-details">

                    <div class="attendee-review-detail">

                        <span>EMAIL</span>

                        <strong>
                            ${email}
                        </strong>

                    </div>


                    <div class="attendee-review-detail">

                        <span>TICKET</span>

                        <strong>
                            ${ticketType}
                        </strong>

                    </div>


                    <div class="attendee-review-detail">

                        <span>SEAT</span>

                        <strong>
                            ${seatDisplay}
                        </strong>

                    </div>

                </div>

            `;


            reviewAttendees.appendChild(box);
        });
    }


    /* =========================================================
       ADD-ONS
       ========================================================= */

    const reviewAddons =
        document.getElementById("reviewAddons");

    let addonTotal = 0;

    let hasAddons = false;


    Object.entries(addons).forEach(
        ([name, quantity]) => {

            const amount =
                Number(quantity) || 0;

            if (amount <= 0) {
                return;
            }

            hasAddons = true;

            const unitPrice =
                addonPrices[name] || 0;

            const total =
                unitPrice * amount;

            addonTotal += total;


            const row =
                document.createElement("div");

            row.className =
                "review-row";


            row.innerHTML = `

                <div>

                    <strong>
                        ${name}
                    </strong>

                    <span>
                        ${amount} × ${formatRupiah(unitPrice)}
                    </span>

                </div>

                <strong>
                    ${formatRupiah(total)}
                </strong>

            `;


            reviewAddons.appendChild(row);
        }
    );


    if (!hasAddons) {

        reviewAddons.innerHTML = `
            <p class="review-empty">
                No add-ons selected.
            </p>
        `;

    } else {

        const owner =
            document.createElement("div");

        owner.className =
            "review-addon-owner";


        owner.innerHTML = `
            Add-ons under:
            <strong>
                ${addonOwner || "Not specified"}
            </strong>
        `;


        reviewAddons.appendChild(owner);
    }


    /* =========================================================
       PRICE BREAKDOWN
       ========================================================= */

    const ticketPriceBreakdown =
        document.getElementById(
            "ticketPriceBreakdown"
        );

    const addonPriceBreakdown =
        document.getElementById(
            "addonPriceBreakdown"
        );


    /*
     * Ticket breakdown by product.
     */

    const ticketBreakdown = {};


    attendees.forEach((attendee, index) => {

        const type =
            getTicketType(attendee);

        const price =
            attendeeTicketPrices[index] || 0;

        if (!type) {
            return;
        }

        if (!ticketBreakdown[type]) {

            ticketBreakdown[type] = {
                quantity: 0,
                total: 0
            };
        }

        ticketBreakdown[type].quantity++;

        ticketBreakdown[type].total += price;
    });


    Object.entries(ticketBreakdown).forEach(
        ([type, data]) => {

            const row =
                document.createElement("div");

            row.className =
                "price-line";


            row.innerHTML = `

                <span>
                    ${type} × ${data.quantity}
                </span>

                <strong>
                    ${formatRupiah(data.total)}
                </strong>

            `;


            ticketPriceBreakdown.appendChild(row);
        }
    );


    /*
     * Add-on breakdown.
     */

    Object.entries(addons).forEach(
        ([name, quantity]) => {

            const amount =
                Number(quantity) || 0;

            if (amount <= 0) {
                return;
            }

            const unitPrice =
                addonPrices[name] || 0;

            const total =
                unitPrice * amount;


            const row =
                document.createElement("div");

            row.className =
                "price-line";


            row.innerHTML = `

                <span>
                    ${name} × ${amount}
                </span>

                <strong>
                    ${formatRupiah(total)}
                </strong>

            `;


            addonPriceBreakdown.appendChild(row);
        }
    );


    /* =========================================================
       TOTAL
       ========================================================= */

    const subtotal =
        ticketTotal + addonTotal;


    document.getElementById(
        "subtotalPrice"
    ).textContent =
        formatRupiah(subtotal);


    document.getElementById(
        "reviewTotal"
    ).textContent =
        formatRupiah(subtotal);


    /* =========================================================
       CONTINUE
       ========================================================= */

    document
        .getElementById("continueToPayment")
        .addEventListener(
            "click",
            () => {

                localStorage.setItem(
                    "orderTotal",
                    subtotal
                );

                window.location.href =
                    "payment.html";
            }
        );

</script>

</body>
</html>
