<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Review — TEDxRegents Secondary School Bali YOUTH</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
    <img
        src="logo-white.png"
        alt="TEDxRegents Secondary School Bali YOUTH"
        class="site-logo"
    >
</header>


<main>

    <!-- PROGRESS -->

    <div class="progress">
        <span>01 Tickets</span>
        <span>02 Details</span>
        <span>03 Attendees</span>
        <span>04 Seats</span>
        <span>05 Add-ons</span>
        <span class="active">06 Review</span>
        <span>07 Payment</span>
    </div>


    <!-- INTRO -->

    <section class="review-section">

        <p class="eyebrow">REVIEW</p>

        <h1>Check your order.</h1>

        <p class="subtitle">
            Make sure everything looks right before continuing to payment.
        </p>

        <!-- ORDERER -->

        <div class="review-section-heading review-heading">
            <h2>Your Details</h2>
        </div>
        
        <div id="reviewOrderer"></div>


        <!-- ATTENDEES -->

        <div class="review-section-heading">
            <h2>Attendees Details</h2>
        </div>

        <div id="reviewAttendees"></div>


        <!-- PRICE BREAKDOWN -->

        <div class="review-section-heading price-heading">
            <h2>Price Breakdown</h2>
        </div>

    <div class="price-breakdown">

    <div id="ticketPriceBreakdown"></div>

    <div id="addonPriceBreakdown"></div>

</div>



        <!-- TOTAL -->

        <div class="review-total">

            <span>Total</span>

            <strong id="reviewTotal">
                Rp0
            </strong>

        </div>


        <!-- CONTINUE -->

        <button
            type="button"
            class="continue-button"
            id="continueToPayment"
        >
            Continue to Payment
        </button>

    </section>

</main>


<script>

function getStoredJSON(key, fallback) {

    try {

        const value = localStorage.getItem(key);

        return value
            ? JSON.parse(value)
            : fallback;

    } catch (error) {

        return fallback;
    }
}


/* =========================
   LOAD DATA
========================= */

const quantities =
    getStoredJSON("ticketQuantities", {});

const attendees =
    getStoredJSON("attendees", []);

const ordererDetails =
    getStoredJSON("ordererDetails", {});

const selectedSeats =
    getStoredJSON("selectedSeats", {});

const addons =
    getStoredJSON("addons", {});

const addonOwner =
    localStorage.getItem("addonOwner") || "";


/* =========================
   BUILD TICKET TYPES
========================= */

const ticketTypes = [];

for (
    let i = 0;
    i < (quantities.mainHall || 0);
    i++
) {
    ticketTypes.push("Main Hall");
}

for (
    let i = 0;
    i < (quantities.vip || 0);
    i++
) {
    ticketTypes.push("VIP");
}

for (
    let i = 0;
    i < (quantities.watchParty || 0);
    i++
) {
    ticketTypes.push("Watch Party");
}


/* =========================
   PRICES
========================= */

const ticketPrices = {

    mainHallEarly: 40000,
    mainHallNormal: 45000,

    vipEarly: 50000,
    vipNormal: 55000,

    watchPartyEarly: 25000,
    watchPartyNormal: 30000
};


const addonInfo = {

    toteBag: {
        name: "Tote Bag",
        price: 60000
    },

    notebook: {
        name: "Notebook",
        price: 30000
    },

    pen: {
        name: "Pen",
        price: 10000
    },

    lanyard: {
        name: "Lanyard",
        price: 15000
    },

    stickerPack: {
        name: "Sticker Pack",
        price: 3000
    },

    food: {
        name: "Food",
        price: 30000
    }
};

/* =========================
   ORDERER DETAILS
========================= */
function displayOrderer() {

    const container =
        document.getElementById("reviewOrderer");

    if (!container) return;

    container.innerHTML = `

        <div class="orderer-grid">

            <div class="review-detail">
                <span>Full name</span>
                <strong>
                    ${ordererDetails.name || "Not provided"}
                </strong>
            </div>

            <div class="review-detail">
                <span>Phone</span>
                <strong>
                    ${ordererDetails.phone || "Not provided"}
                </strong>
            </div>

            <div class="review-detail email-detail">
                <span>Email</span>
                <strong>
                    ${ordererDetails.email || "Not provided"}
                </strong>
            </div>

        </div>
    `;
}
    
/* =========================
   ATTENDEE DETAILS
========================= */

function displayAttendees() {

    const container =
        document.getElementById("reviewAttendees");

    if (!container) return;

    container.innerHTML = "";

    const shouldCollapse =
        attendees.length >= 3;


    attendees.forEach((attendee, index) => {

        const ticketType =
            ticketTypes[index] || "Ticket";

        const attendeeNumber =
            index + 1;

        const seat =
            selectedSeats[attendeeNumber];


        const card =
            document.createElement(
                shouldCollapse
                    ? "details"
                    : "div"
            );

        card.className =
            "attendee-review-card";


        if (shouldCollapse) {

            const summary =
                document.createElement("summary");

            summary.innerHTML = `
                <span>
                    ${attendee.name || "Attendee " + attendeeNumber}
                </span>

                <span class="attendee-toggle">
                    View details
                </span>
            `;

            card.appendChild(summary);
        }


        const content =
            document.createElement("div");

        content.className =
            "attendee-review-content";


        content.innerHTML = `

            <div class="attendee-full-name">
                <span>Full name</span>
                <strong>
                    ${attendee.name || "Not provided"}
                </strong>
            </div>

            <div class="attendee-divider"></div>

            <div class="attendee-info-grid">

                <div class="attendee-info">
                    <span>Ticket</span>
                    <strong>
                        ${ticketType}
                    </strong>
                </div>

                <div class="attendee-info">
                    <span>Seat</span>
                    <strong>
                        ${
                            seat
                                ? seat.display
                                : "Not selected"
                        }
                    </strong>
                </div>

                <div class="attendee-info">
                    <span>Phone</span>
                    <strong>
                        ${attendee.phone || "Not provided"}
                    </strong>
                </div>

                <div class="attendee-info">
                    <span>Email</span>
                    <strong>
                        ${attendee.email || "Not provided"}
                    </strong>
                </div>

            </div>
        `;


        card.appendChild(content);

        container.appendChild(card);

    });
}



/* =========================
   PRICE CALCULATION
========================= */

function calculatePrices() {

    const mainHallCount =
        Number(quantities.mainHall) || 0;

    const vipCount =
        Number(quantities.vip) || 0;

    const watchPartyCount =
        Number(quantities.watchParty) || 0;


    /* =========================
       EARLY BIRD
    ========================= */

    const mainVipTotal =
        mainHallCount + vipCount;

    const mainVipEarlyBird =
        Math.min(mainVipTotal, 10);

    const mainHallEarlyBird =
        Math.min(
            mainHallCount,
            mainVipEarlyBird
        );

    const vipEarlyBird =
        Math.min(
            vipCount,
            mainVipEarlyBird -
            mainHallEarlyBird
        );

    const mainHallNormal =
        mainHallCount -
        mainHallEarlyBird;

    const vipNormal =
        vipCount -
        vipEarlyBird;


    const watchPartyEarlyBird =
        Math.min(
            watchPartyCount,
            10
        );

    const watchPartyNormal =
        watchPartyCount -
        watchPartyEarlyBird;


    /* =========================
       TICKET TOTALS
    ========================= */

    const mainHallEarlyTotal =
        mainHallEarlyBird *
        ticketPrices.mainHallEarly;

    const mainHallNormalTotal =
        mainHallNormal *
        ticketPrices.mainHallNormal;

    const vipEarlyTotal =
        vipEarlyBird *
        ticketPrices.vipEarly;

    const vipNormalTotal =
        vipNormal *
        ticketPrices.vipNormal;

    const watchPartyEarlyTotal =
        watchPartyEarlyBird *
        ticketPrices.watchPartyEarly;

    const watchPartyNormalTotal =
        watchPartyNormal *
        ticketPrices.watchPartyNormal;


    const ticketTotal =
        mainHallEarlyTotal +
        mainHallNormalTotal +
        vipEarlyTotal +
        vipNormalTotal +
        watchPartyEarlyTotal +
        watchPartyNormalTotal;


    /* =========================
       TICKET BREAKDOWN
    ========================= */

    const ticketBreakdown =
        document.getElementById(
            "ticketPriceBreakdown"
        );

    if (ticketBreakdown) {

        ticketBreakdown.innerHTML = "";


        function addTicketLine(
            label,
            quantity,
            price
        ) {

            if (quantity <= 0) return;

            const row =
                document.createElement("div");

            row.className =
                "price-line";

            row.innerHTML = `
                <span>
                    ${label} × ${quantity}
                </span>

                <strong>
                    Rp${(
                        quantity * price
                    ).toLocaleString("id-ID")}
                </strong>
            `;

            ticketBreakdown.appendChild(row);
        }


        addTicketLine(
            "Main Hall — Early Bird",
            mainHallEarlyBird,
            ticketPrices.mainHallEarly
        );

        addTicketLine(
            "Main Hall — Normal",
            mainHallNormal,
            ticketPrices.mainHallNormal
        );

        addTicketLine(
            "VIP — Early Bird",
            vipEarlyBird,
            ticketPrices.vipEarly
        );

        addTicketLine(
            "VIP — Normal",
            vipNormal,
            ticketPrices.vipNormal
        );

        addTicketLine(
            "Watch Party — Early Bird",
            watchPartyEarlyBird,
            ticketPrices.watchPartyEarly
        );

        addTicketLine(
            "Watch Party — Normal",
            watchPartyNormal,
            ticketPrices.watchPartyNormal
        );


        /* TICKETS SUBTOTAL */

        const ticketSubtotal =
            document.createElement("div");

        ticketSubtotal.className =
            "price-subtotal";

        ticketSubtotal.innerHTML = `
            <span>Tickets subtotal</span>

            <strong>
                Rp${ticketTotal.toLocaleString("id-ID")}
            </strong>
        `;

        ticketBreakdown.appendChild(
            ticketSubtotal
        );
    }


    /* =========================
       ADD-ON TOTAL
    ========================= */

    let addonTotal = 0;

    Object.keys(addons).forEach(key => {

        const quantity =
            Number(addons[key]) || 0;

        const info =
            addonInfo[key];

        if (!info) return;

        addonTotal +=
            quantity * info.price;
    });


    /* =========================
       ADD-ON BREAKDOWN
    ========================= */

    const addonBreakdown =
        document.getElementById(
            "addonPriceBreakdown"
        );

    if (addonBreakdown) {

        addonBreakdown.innerHTML = "";

        const ownerIndex =
            Number(addonOwner);

        const owner =
            attendees[ownerIndex];

        const ownerName =
            owner
                ? owner.name
                : "Unassigned";


        const selectedAddons = [];


        Object.keys(addons).forEach(key => {

            const quantity =
                Number(addons[key]) || 0;

            const info =
                addonInfo[key];

            if (!info || quantity <= 0) {
                return;
            }

            selectedAddons.push({
                name: info.name,
                quantity: quantity,
                price: info.price
            });

        });


        if (selectedAddons.length > 0) {

            const heading =
                document.createElement("div");

            heading.className =
                "addon-owner-heading";

            heading.innerHTML = `
                <span class="addon-label">
                    Add ons
                </span>

                <span class="addon-under">
                    , under ${ownerName}
                </span>
            `;

            addonBreakdown.appendChild(
                heading
            );


            selectedAddons.forEach(addon => {

                const row =
                    document.createElement("div");

                row.className =
                    "price-line addon-price-line";

                row.innerHTML = `
                    <span>
                        ${addon.name} × ${addon.quantity}
                    </span>

                    <strong>
                        Rp${(
                            addon.price *
                            addon.quantity
                        ).toLocaleString("id-ID")}
                    </strong>
                `;

                addonBreakdown.appendChild(row);

            });


            /* ADD-ONS SUBTOTAL */

            const addonSubtotal =
                document.createElement("div");

            addonSubtotal.className =
                "price-subtotal";

            addonSubtotal.innerHTML = `
                <span>Add ons subtotal</span>

                <strong>
                    Rp${addonTotal.toLocaleString("id-ID")}
                </strong>
            `;

            addonBreakdown.appendChild(
                addonSubtotal
            );
        }
    }


    /* =========================
       GRAND TOTAL
    ========================= */

    const grandTotal =
        ticketTotal + addonTotal;


    const totalElement =
        document.getElementById(
            "reviewTotal"
        );

    if (totalElement) {

        totalElement.textContent =
            "Rp" +
            grandTotal.toLocaleString("id-ID");
    }
}


/* =========================
   CONTINUE
========================= */

function continueToPayment() {

    window.location.href =
        "payment.html";
}


/* =========================
   START
========================= */
displayOrderer();

displayAttendees();

calculatePrices();



document
    .getElementById("continueToPayment")
    .addEventListener("click", continueToPayment);

</script>

</body>
</html>
