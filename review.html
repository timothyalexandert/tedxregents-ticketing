<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Review — TEDxRegents Secondary School Bali YOUTH</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
    <img
        src="logo-white.png"
        alt="TEDxRegents Secondary School Bali YOUTH"
        class="site-logo"
    >
</header>


<main>

    <!-- PROGRESS -->

    <div class="progress">
        <span>01 Tickets</span>
        <span>02 Details</span>
        <span>03 Attendees</span>
        <span>04 Seats</span>
        <span>05 Add-ons</span>
        <span class="active">06 Review</span>
        <span>07 Payment</span>
    </div>


    <!-- INTRO -->

    <section class="review-section">

        <p class="eyebrow">REVIEW</p>

        <h1>Check your order.</h1>

        <p class="subtitle">
            Make sure everything looks right before continuing to payment.
        </p>


        <!-- ATTENDEES -->

        <div class="review-section-heading">
            <h2>Attendees</h2>
        </div>

        <div id="reviewAttendees"></div>


        <!-- ADD-ONS -->

        <div class="review-section-heading addons-review-heading">
            <h2>Add-ons</h2>
        </div>

        <div class="review-block">

            <div id="reviewAddons"></div>

        </div>


        <!-- PRICE BREAKDOWN -->

        <div class="review-section-heading price-heading">
            <h2>Price Breakdown</h2>
        </div>

        <div class="price-breakdown">

            <div id="ticketPriceBreakdown"></div>

            <div id="addonPriceBreakdown"></div>

            <div class="price-divider"></div>

            <div class="price-line subtotal-line">
                <span>Subtotal</span>
                <strong id="subtotalPrice">Rp0</strong>
            </div>

        </div>


        <!-- TOTAL -->

        <div class="review-total">

            <span>Total</span>

            <strong id="reviewTotal">
                Rp0
            </strong>

        </div>


        <!-- CONTINUE -->

        <button
            type="button"
            class="continue-button"
            id="continueToPayment"
        >
            Continue to Payment
        </button>

    </section>

</main>


<script>

function getStoredJSON(key, fallback) {

    try {

        const value = localStorage.getItem(key);

        return value
            ? JSON.parse(value)
            : fallback;

    } catch (error) {

        return fallback;
    }
}


/* =========================
   LOAD DATA
========================= */

const quantities =
    getStoredJSON("ticketQuantities", {});

const attendees =
    getStoredJSON("attendees", []);

const selectedSeats =
    getStoredJSON("selectedSeats", {});

const addons =
    getStoredJSON("addons", {});

const addonOwner =
    localStorage.getItem("addonOwner") || "";


/* =========================
   BUILD TICKET TYPES
========================= */

const ticketTypes = [];

for (
    let i = 0;
    i < (quantities.mainHall || 0);
    i++
) {
    ticketTypes.push("Main Hall");
}

for (
    let i = 0;
    i < (quantities.vip || 0);
    i++
) {
    ticketTypes.push("VIP");
}

for (
    let i = 0;
    i < (quantities.watchParty || 0);
    i++
) {
    ticketTypes.push("Watch Party");
}


/* =========================
   PRICES
========================= */

const ticketPrices = {

    mainHallEarly: 40000,
    mainHallNormal: 45000,

    vipEarly: 50000,
    vipNormal: 55000,

    watchPartyEarly: 25000,
    watchPartyNormal: 30000
};


const addonInfo = {

    toteBag: {
        name: "Tote Bag",
        price: 60000
    },

    notebook: {
        name: "Notebook",
        price: 30000
    },

    pen: {
        name: "Pen",
        price: 10000
    },

    lanyard: {
        name: "Lanyard",
        price: 15000
    },

    stickerPack: {
        name: "Sticker Pack",
        price: 3000
    },

    food: {
        name: "Food",
        price: 30000
    }
};


/* =========================
   ATTENDEE DETAILS
========================= */

function displayAttendees() {

    const container =
        document.getElementById("attendeesReview");

    if (!container) return;

    container.innerHTML = "";

    attendees.forEach((attendee, index) => {

        const ticketType =
            ticketTypes[index] || "Ticket";

        /*
         * Seats are stored using attendee numbers:
         * 1, 2, 3...
         *
         * Array indexes start at:
         * 0, 1, 2...
         *
         * Therefore we use index + 1.
         */

        const attendeeNumber = index + 1;

        const seat =
            selectedSeats[attendeeNumber];

        const card =
            document.createElement("div");

        card.className =
            "attendee-review-card";

        card.innerHTML = `

            <div class="attendee-review-details">

                <div class="attendee-review-detail">
                    <span>Name</span>
                    <strong>
                        ${attendee.name || "Not provided"}
                    </strong>
                </div>

                <div class="attendee-review-detail">
                    <span>Email</span>
                    <strong>
                        ${attendee.email || "Not provided"}
                    </strong>
                </div>

                <div class="attendee-review-detail">
                    <span>Ticket</span>
                    <strong>
                        ${ticketType}
                    </strong>
                </div>

                <div class="attendee-review-detail">
                    <span>Seat</span>
                    <strong>
                        ${
                            seat
                                ? seat.display
                                : "Not selected"
                        }
                    </strong>
                </div>

            </div>
        `;

        container.appendChild(card);
    });
}


/* =========================
   ADD-ONS
========================= */

function displayAddons() {

    const container =
        document.getElementById("addonsReview");

    if (!container) return;

    container.innerHTML = "";

    let hasAddons = false;

    Object.keys(addons).forEach(key => {

        const quantity =
            Number(addons[key]) || 0;

        if (quantity <= 0) return;

        const info =
            addonInfo[key];

        if (!info) return;

        hasAddons = true;

        const row =
            document.createElement("div");

        row.className = "price-line";

        row.innerHTML = `

            <span>
                ${info.name} × ${quantity}
            </span>

            <strong>
                Rp${(
                    info.price * quantity
                ).toLocaleString("id-ID")}
            </strong>

        `;

        container.appendChild(row);
    });


    /*
     * Show who the add-ons belong to.
     */

    if (hasAddons) {

        const ownerIndex =
            Number(addonOwner);

        const owner =
            attendees[ownerIndex];

        const ownerName =
            owner
                ? owner.name
                : "Not specified";

        const ownerTicket =
            ticketTypes[ownerIndex]
                || "";

        const ownerRow =
            document.createElement("div");

        ownerRow.className =
            "attendee-review-detail";

        ownerRow.innerHTML = `

            <span>Add-ons under</span>

            <strong>
                ${ownerName}
                ${
                    ownerTicket
                        ? ` — ${ownerTicket}`
                        : ""
                }
            </strong>

        `;

        container.insertBefore(
            ownerRow,
            container.firstChild
        );
    }


    if (!hasAddons) {

        container.innerHTML = `
            <p>No add-ons selected.</p>
        `;
    }
}


/* =========================
   PRICE CALCULATION
========================= */

function calculatePrices() {

    const mainHallCount =
        Number(quantities.mainHall) || 0;

    const vipCount =
        Number(quantities.vip) || 0;

    const watchPartyCount =
        Number(quantities.watchParty) || 0;


    /* =========================
       EARLY BIRD
    ========================= */

    // Main Hall + VIP share one
    // combined Early Bird pool.

    const mainVipTotal =
        mainHallCount + vipCount;

    const mainVipEarlyBird =
        Math.min(mainVipTotal, 10);

    const mainHallEarlyBird =
        Math.min(
            mainHallCount,
            mainVipEarlyBird
        );

    const vipEarlyBird =
        Math.min(
            vipCount,
            mainVipEarlyBird -
            mainHallEarlyBird
        );

    const mainHallNormal =
        mainHallCount -
        mainHallEarlyBird;

    const vipNormal =
        vipCount -
        vipEarlyBird;


    // Watch Party has its own
    // Early Bird pool.

    const watchPartyEarlyBird =
        Math.min(
            watchPartyCount,
            10
        );

    const watchPartyNormal =
        watchPartyCount -
        watchPartyEarlyBird;


    /* =========================
       TICKET TOTALS
    ========================= */

    const mainHallEarlyTotal =
        mainHallEarlyBird *
        ticketPrices.mainHallEarly;

    const mainHallNormalTotal =
        mainHallNormal *
        ticketPrices.mainHallNormal;

    const vipEarlyTotal =
        vipEarlyBird *
        ticketPrices.vipEarly;

    const vipNormalTotal =
        vipNormal *
        ticketPrices.vipNormal;

    const watchPartyEarlyTotal =
        watchPartyEarlyBird *
        ticketPrices.watchPartyEarly;

    const watchPartyNormalTotal =
        watchPartyNormal *
        ticketPrices.watchPartyNormal;


    const ticketTotal =
        mainHallEarlyTotal +
        mainHallNormalTotal +
        vipEarlyTotal +
        vipNormalTotal +
        watchPartyEarlyTotal +
        watchPartyNormalTotal;


    /* =========================
       TICKET BREAKDOWN
    ========================= */

    const ticketBreakdown =
        document.getElementById(
            "ticketPriceBreakdown"
        );

    if (ticketBreakdown) {

        ticketBreakdown.innerHTML = "";


        function addTicketLine(
            label,
            quantity,
            price
        ) {

            if (quantity <= 0) return;

            const row =
                document.createElement("div");

            row.className = "price-line";

            row.innerHTML = `
                <span>
                    ${label} × ${quantity}
                </span>

                <strong>
                    Rp${(
                        quantity * price
                    ).toLocaleString("id-ID")}
                </strong>
            `;

            ticketBreakdown.appendChild(row);
        }


        addTicketLine(
            "Main Hall — Early Bird",
            mainHallEarlyBird,
            ticketPrices.mainHallEarly
        );

        addTicketLine(
            "Main Hall — Normal",
            mainHallNormal,
            ticketPrices.mainHallNormal
        );

        addTicketLine(
            "VIP — Early Bird",
            vipEarlyBird,
            ticketPrices.vipEarly
        );

        addTicketLine(
            "VIP — Normal",
            vipNormal,
            ticketPrices.vipNormal
        );

        addTicketLine(
            "Watch Party — Early Bird",
            watchPartyEarlyBird,
            ticketPrices.watchPartyEarly
        );

        addTicketLine(
            "Watch Party — Normal",
            watchPartyNormal,
            ticketPrices.watchPartyNormal
        );
    }


    /* =========================
       ADD-ON TOTAL
    ========================= */

    let addonTotal = 0;

    Object.keys(addons).forEach(key => {

        const quantity =
            Number(addons[key]) || 0;

        const info =
            addonInfo[key];

        if (!info) return;

        addonTotal +=
            quantity * info.price;
    });


    /* =========================
       ADD-ON BREAKDOWN
    ========================= */

    const addonBreakdown =
        document.getElementById(
            "addonPriceBreakdown"
        );

    if (addonBreakdown) {

        addonBreakdown.innerHTML = "";


        Object.keys(addons).forEach(key => {

            const quantity =
                Number(addons[key]) || 0;

            const info =
                addonInfo[key];

            if (!info || quantity <= 0) {
                return;
            }

            const row =
                document.createElement("div");

            row.className = "price-line";

            row.innerHTML = `
                <span>
                    ${info.name} × ${quantity}
                </span>

                <strong>
                    Rp${(
                        quantity * info.price
                    ).toLocaleString("id-ID")}
                </strong>
            `;

            addonBreakdown.appendChild(row);
        });
    }


    /* =========================
       SUBTOTAL / TOTAL
    ========================= */

    const subtotal =
        ticketTotal + addonTotal;


    const subtotalElement =
        document.getElementById(
            "subtotalPrice"
        );

    if (subtotalElement) {

        subtotalElement.textContent =
            "Rp" +
            subtotal.toLocaleString("id-ID");
    }


    const totalElement =
        document.getElementById(
            "reviewTotal"
        );

    if (totalElement) {

        totalElement.textContent =
            "Rp" +
            subtotal.toLocaleString("id-ID");
    }
}


/* =========================
   CONTINUE
========================= */

function continueToPayment() {

    window.location.href =
        "payment.html";
}


/* =========================
   START
========================= */

displayAttendees();

displayAddons();

calculatePrices();

document
    .getElementById("continueToPayment")
    .addEventListener("click", continueToPayment);

</script>

</body>
</html>
